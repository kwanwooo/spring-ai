spring.application.name=spring-ai

# \u5173\u95ED Spring AI \u9ED8\u8BA4\u7684 OpenAI \u5404\u7C7B\u6A21\u578B\u81EA\u52A8\u88C5\u914D\uFF08\u804A\u5929/\u56FE\u50CF/\u5D4C\u5165/\u97F3\u9891/\u5BA1\u6838\uFF09\u4E0E
# ChatClient \u81EA\u52A8\u88C5\u914D\uFF0C\u6539\u4E3A\u4E0B\u65B9\u624B\u52A8\u914D\u7F6E\u7684\u591A\u6A21\u578B\uFF08DeepSeek / GLM\uFF09\uFF0C\u907F\u514D\u591A\u6A21\u578B bean \u51B2\u7A81
spring.ai.model.chat=none
spring.ai.model.image=none
spring.ai.model.embedding=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none
spring.ai.chat.client.enabled=false

# DeepSeek\uFF08OpenAI \u517C\u5BB9\uFF09
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
spring.ai.deepseek.model=deepseek-chat

# GLM \u667A\u8C31\uFF08OpenAI \u517C\u5BB9\uFF09
spring.ai.glm.base-url=https://open.bigmodel.cn/api/paas/v4
spring.ai.glm.api-key=${GLM_API_KEY:}
spring.ai.glm.model=glm-4

# \u4F1A\u8BDD\u8BB0\u5FC6\u6301\u4E45\u5316\uFF08MySQL\uFF09
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# \u542F\u52A8\u65F6\u81EA\u52A8\u521B\u5EFA\u4F1A\u8BDD\u8BB0\u5FC6\u8868\uFF08\u4F7F\u7528 Spring AI \u5185\u7F6E schema-mysql.sql\uFF0C\u5E42\u7B49\uFF09
# \u751F\u4EA7\u73AF\u5883\u53EF\u6539\u4E3A never\uFF0C\u5E76\u624B\u52A8\u6267\u884C db/chat-memory-mysql.sql
spring.ai.chat.memory.repository.jdbc.initialize-schema=never

# RAG\uFF1AGLM \u5D4C\u5165\u6A21\u578B\uFF08OpenAI \u517C\u5BB9\u63A5\u53E3\uFF0C\u7528\u4E8E\u6587\u672C\u5411\u91CF\u5316\uFF09
spring.ai.glm.embedding.model=embedding-3

# RAG\uFF1ASimpleVectorStore \u6587\u4EF6\u6301\u4E45\u5316\u8DEF\u5F84\uFF08\u91CD\u542F\u540E\u81EA\u52A8\u52A0\u8F7D\uFF09
spring.ai.rag.vector-store-file=data/vectorstore.json

# \u6A21\u578B\u964D\u7EA7 + \u91CD\u8BD5\uFF1A\u6BCF\u4E2A\u6A21\u578B\u5C1D\u8BD5 max-attempts \u6B21\uFF08\u542B\u9996\u6B21\uFF09\uFF0C\u5931\u8D25\u540E\u964D\u7EA7\u5230\u5907\u7528\u6A21\u578B
spring.ai.fallback.enabled=true
spring.ai.fallback.max-attempts=2
spring.ai.fallback.backoff-ms=1000

# \u6210\u672C\u6838\u7B97\u5355\u4EF7\uFF08\u5143 / \u767E\u4E07 token\uFF0C\u6309\u6A21\u578B\u540D\u5339\u914D\uFF1B\u8BF7\u6309\u5B9E\u9645\u4EF7\u683C\u8C03\u6574\uFF09
spring.ai.pricing.models.deepseek-chat.input=1.0
spring.ai.pricing.models.deepseek-chat.output=4.0
spring.ai.pricing.models.glm-4.input=0.5
spring.ai.pricing.models.glm-4.output=0.5
spring.ai.pricing.models.embedding-3.input=0.5
spring.ai.pricing.models.embedding-3.output=0.0

# Token \u7528\u91CF\u8868\u4E0D\u81EA\u52A8\u5EFA\u8868\uFF0C\u9700\u624B\u52A8\u6267\u884C db/token-usage-mysql.sql\uFF08\u4E0E\u4F1A\u8BDD\u8BB0\u5FC6\u8868\u4E00\u81F4\uFF09
spring.sql.init.mode=never